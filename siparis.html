<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sipariş Detayı | Hexadigital</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/shop.css">
</head>
<body>
    <canvas id="hexa-bg"></canvas>

    <header class="header">
        <div class="container header__container">
            <a href="index.html" class="logo">
                <img src="assets/logohorizontal.png" alt="Hexadigital">
            </a>
            <div class="header__actions" style="margin-left:auto;">
                <nav class="nav">
                    <ul class="nav__list">
                        <li class="nav__item"><a href="index.html" class="nav__link">Ana Sayfa</a></li>
                        <li class="nav__item"><a href="index.html#stores" class="nav__link">Mağazalar</a></li>
                        <li class="nav__item"><a href="contact.html" class="nav__link">İletişim</a></li>
                    </ul>
                </nav>
                <button class="mobile-menu-btn" aria-label="Menüyü Aç">
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="services" style="min-height: 70vh; padding-top: var(--spacing-md);">
            <div class="container" style="max-width: 760px;">

                <div class="order-head">
                    <div>
                        <h1 class="section-title" style="margin-bottom:0;">Sipariş Detayı</h1>
                        <p class="order-meta" id="order-meta"></p>
                    </div>
                    <button class="btn btn--primary" id="btn-pdf" style="display:none;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        PDF İndir
                    </button>
                </div>

                <!-- Durum mesajı -->
                <div class="shop-status" id="order-status">Sipariş yükleniyor...</div>

                <!-- Siparişin verildiği mağaza -->
                <div class="order-store" id="order-store" style="display:none;">
                    <img class="order-store__logo" id="order-store-logo" src="" alt="" style="display:none;">
                    <div class="order-store__info">
                        <div class="order-store__name" id="order-store-name"></div>
                        <a class="order-store__wa" id="order-store-wa" href="#" target="_blank" rel="noopener"></a>
                    </div>
                </div>

                <!-- Sipariş sahibi -->
                <div class="order-customer" id="order-customer" style="display:none;">
                    <div class="order-customer__title">Sipariş Sahibi</div>
                    <div class="order-customer__row">
                        <span class="order-customer__label">Ad Soyad</span>
                        <span id="order-customer-name"></span>
                    </div>
                    <div class="order-customer__row">
                        <span class="order-customer__label">Telefon</span>
                        <a id="order-customer-phone" href="#"></a>
                    </div>
                </div>

                <!-- Sipariş öğeleri -->
                <div class="order-items" id="order-items"></div>

                <!-- Ara toplam + indirim (yalnızca indirim uygulandıysa) -->
                <div class="order-summary" id="order-summary" style="display:none;">
                    <div class="order-summary__row">
                        <span>Ara Toplam</span>
                        <span id="order-subtotal-amount"></span>
                    </div>
                    <div class="order-summary__row order-summary__row--discount">
                        <span id="order-discount-label">İndirim</span>
                        <span id="order-discount-amount"></span>
                    </div>
                    <!-- Toptan (satır bazlı) indirimlerin dökümü -->
                    <div id="order-discount-lines"></div>
                </div>

                <!-- Toplam -->
                <div class="order-total" id="order-total" style="display:none;">
                    <span>Toplam</span>
                    <strong id="order-total-amount"></strong>
                </div>

            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer__container">
            <div class="footer__brand">
                <img src="assets/logo.png" alt="Hexadigital" class="footer__logo">
                <p>&copy; 2025 Hexadigital. Tüm hakları saklıdır.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/siparis.js"></script>
</body>
</html>
